name: Configure Strava subscription
on: workflow_dispatch
permissions:
  contents: read
jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Register subscription
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          SYNC_WORKER_URL: ${{ secrets.SYNC_WORKER_URL }}
          WEBHOOK_PATH_SECRET: ${{ secrets.WEBHOOK_PATH_SECRET }}
          STRAVA_VERIFY_TOKEN: ${{ secrets.STRAVA_VERIFY_TOKEN }}
        run: node scripts/strava-subscription.mjs --create
